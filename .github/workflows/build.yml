name: Build GFX Reincarnate

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (armeabi-v7a + arm64-v8a)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK"
          "$NDK/ndk-build" NDK_PROJECT_PATH="$PWD" \
            APP_BUILD_SCRIPT="$PWD/jni/Android.mk" \
            NDK_APPLICATION_MK="$PWD/jni/Application.mk" \
            NDK_OUT="$PWD/obj" NDK_LIBS_OUT="$PWD/libs" -j"$(nproc)"
          ls -R libs

      - name: Upload .so files
        uses: actions/upload-artifact@v4
        with:
          name: GFXReincarnate-so
          path: |
            libs/armeabi-v7a/*.so
            libs/arm64-v8a/*.so
            configs/*.ini
