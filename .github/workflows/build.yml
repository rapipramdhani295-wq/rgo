name: Build RGO
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q project.zip -d src
      - name: Build
        run: |
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=src APP_BUILD_SCRIPT=src/jni/Android.mk NDK_APPLICATION_MK=src/jni/Application.mk
      - uses: actions/upload-artifact@v4
        with:
          name: RGO-libs
          path: src/libs/**/*.so
